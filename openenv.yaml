spec_version: 1
name: orderschema
type: space
runtime: fastapi
app: server.app:app
port: 8000
tasks:
  - id: task_easy
    difficulty: easy
    max_steps: 10
    grader:
      type: llm
      prompt_template: "Score the prediction against the ground truth from 0.0 to 1.0."

  - id: task_medium
    difficulty: medium
    max_steps: 15
    grader:
      type: llm
      prompt_template: "Score the prediction against the ground truth from 0.0 to 1.0."

  - id: task_hard
    difficulty: hard
    max_steps: 20
    grader:
      type: llm
      prompt_template: "Score the prediction against the ground truth from 0.0 to 1.0."

